name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -m "not integration" -v

  integration:
    name: Integration tests (real Viron)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VIRON_SRC: ${{ github.workspace }}/.viron-src
      JWT_SECRET: viron-usd-integration-test-secret-0123456789
      JWT_ISSUER: viron-usd-test
      VIRON_URL: http://localhost:9999
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Start Viron (Docker Compose, pinned commit)
        run: tests/integration/start_viron.sh
      - name: Integration tests
        run: python -m pytest -m integration -v -s
      - name: Viron logs
        if: failure()
        run: docker compose -f tests/integration/compose.yml logs --tail 200
      - name: Stop Viron
        if: always()
        run: tests/integration/start_viron.sh down
